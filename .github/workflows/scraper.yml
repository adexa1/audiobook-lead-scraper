name: Weekly Lead Scraper

on:
  schedule:
    - cron: '0 8 * * 1'  # Every Monday at 8:00 AM UTC
  workflow_dispatch:      # Manual trigger from GitHub UI

jobs:
  scrape-amazon:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install playwright==1.44.0
          python -m playwright install chromium
          python -m playwright install-deps chromium

      - name: Execute Scraper Script
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: python amazon_lead_scraper.py

      - name: Save CSV Output
        uses: actions/upload-artifact@v4
        with:
          name: audiobook-leads-${{ github.run_id }}
          path: audiobook_leads.csv
          if-no-files-found: warn
          retention-days: 30
